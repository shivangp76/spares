[package]
name = "spares_server"
version = "0.0.1-alpha.1"
description = "A server to facilitate interacting with spares"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
spares_core = { path = "../spares_core" }
log = "0.4.34"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart"] }
clap = { version = "4.6.7", features = ["derive", "cargo", "env"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
env_logger = "0.11.11"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "chrono", "json", "migrate", "regexp"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
argon2 = "0.6.0"
strum = { version = "0.28.0", features = ["derive"] }
inquire = "0.9.4"
blake3 = "1.8.7"
rand = "0.10.3"
toml_edit = { version = "0.25.17", features = ["serde"] }
tower = { version = "0.5.3", features = ["util"] }
reqwest = { version = "0.13.5", features = ["json"] }

# The router alone, which `spares_wasm` will run in a browser: no HTTP server, no Tokio, and no
# sqlx runtime (see vendor/README.md).
[target.'cfg(target_family = "wasm")'.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["form", "json", "macros", "matched-path", "multipart", "original-uri", "query"] }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "chrono", "json", "migrate", "regexp", "macros"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
