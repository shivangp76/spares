[package]
name = "spares_server"
version = "0.0.1-alpha.1"
description = "A server to facilitate interacting with spares"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
axum = { version = "0.8.8", features = ["macros"] }
clap = { version = "4.6.0", features = ["derive", "cargo"] }
chrono = { version = "0.4.44", features = ["serde"] }
env_logger = "0.11.9"
serde_json = { version = "1.0.149", features = ["preserve_order"] }
spares_core = { path = "../spares_core" }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "chrono", "json", "migrate", "regexp"] }
tokio = { version = "1.50.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors"] }
log = "0.4.29"

# [dev-dependencies]
# tower = { version = "0.4", features = ["util"] }
# tower-http = { version = "0.5.0", features = ["trace"] }
# mime = "0.3"
