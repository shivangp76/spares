[package]
name = "spares_server"
version = "0.0.1-alpha.1"
description = "A server to facilitate interacting with spares"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
clap = { version = "4.6.1", features = ["derive", "cargo"] }
chrono = { version = "0.4.45", features = ["serde"] }
env_logger = "0.11.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
spares_core = { path = "../spares_core" }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "chrono", "json", "migrate", "regexp"] }
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "fs"] }
log = "0.4.32"

[lints]
workspace = true
