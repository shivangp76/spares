[package]
name = "spares_core"
description = "A spaced repetition system written in Rust"
version = "0.0.1-alpha.1"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
async-trait = "0.1.92"
blake3 = "1.8.7"
chrono = { version = "0.4.45", features = ["serde"] }
fancy-regex = "0.20.0"
# Renamed so it does not clash with the `schedulers::fsrs` module.
fsrs-rs = { package = "fsrs", version = "6.6.2" }
futures = "0.3.34"
indexmap = { version = "2.14.2", features = ["serde"] }
indoc = "2.0.8"
itertools = "0.15.0"
log = "0.4.34"
miette = { version = "7.6.0" }
rand = "0.10.3"
rayon = "1.12.0"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_with = { version = "3.24.0", features = ["base64", "chrono_0_4"] }
shellexpand = "3.1.2"
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
thiserror = "2.0.21"
toml_edit = { version = "0.25.17", features = ["serde"] }
typst-syntax = "0.15.1"
xmltree = { version = "0.12.0", features = ["attribute-order"] }
unscanny = "0.1.0"
image = "0.25.10"
resvg = "0.49.0"
tiny-skia = "0.12.0"
tokio = { version = "1", features = ["rt", "sync", "time"] }
diffy = "0.5.2"
unicode-normalization = "0.1.26"
chrono-tz = "0.10.4"
web-time = "1.1"
zip = { version = "2.2.3", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
indicatif = { version = "0.18.6", features = ["rayon"] }
inquire = "0.9.4"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "chrono", "json", "migrate", "regexp"] }
trash = "5.2.9"
# The `typst-render` feature's
typst = { version = "0.15.1", optional = true }
typst-kit = { version = "0.15.1", optional = true, default-features = false, features = ["datetime", "embedded-fonts", "emit-diagnostics", "scan-fonts", "system-files"] }
typst-layout = { version = "0.15.1", optional = true }
typst-pdf = { version = "0.15.1", optional = true }

# In a browser (the web app's copy of the collection). sqlx has no runtime feature: the vendored
# sqlx runs on the browser's event loop instead (vendor/README.md), and tokio's `net` and `fs`
# don't build for wasm32-unknown-unknown.
[target.'cfg(target_family = "wasm")'.dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "chrono", "json", "migrate", "regexp", "macros"] }
chrono = { version = "0.4.45", features = ["serde", "wasmbind"] }
# `rand`'s random numbers, from the browser's `crypto.getRandomValues`
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[features]
# Renders Typst notes in worker processes with the Typst compiler built in, which keep fonts,
# packages and parsed files between renders, instead of running the `typst` CLI once per file (see
# `parsers::impls::typst::worker`). Off here so that the browser's build, and a host that renders
# no Typst, don't build Typst. The server and CLI turn it on by default.
typst-render = ["dep:typst", "dep:typst-kit", "dep:typst-layout", "dep:typst-pdf"]

[dev-dependencies]
criterion = { version = "0.8", features = ["async_futures"] }
pretty_assertions = "1.4.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
uuid = { version = "1.29.0", features = [
    "serde",
    "v4",                # Lets you generate random UUIDs
    "fast-rng",          # Use a faster (but still sufficiently random) RNG
    "macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
]}

[[bench]]
name = "update_notes"
harness = false

# [features]
# testing = [] # Used to mitigate effects to local data files in integration testing. See <https://www.reddit.com/r/rust/comments/ny6k3f/cfgtest_doesnt_take_affect_when_running/>.

[lints]
workspace = true

[[bench]]
name = "statistics"
harness = false
