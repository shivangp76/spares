<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <style id="styleoverrides" media="screen"></style>
    <title>Spares</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#175cd3" />
    <!-- Applies the theme setting (see src/theme.ts) before the first paint so the page doesn't flash -->
    <script>
      try {
        const theme = localStorage.getItem('spares_theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        // The page width setting (see src/preferences.ts)
        const pageWidth = localStorage.getItem('spares_page_width');
        if (pageWidth === 'wide' || pageWidth === 'full') document.documentElement.dataset.pageWidth = pageWidth;
      } catch {}
    </script>
  </head>
  <body style="margin:0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
