[package]
name = "spares_cli"
version = "0.0.1-alpha.1"
description = "A CLI to interface with spares"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "spares"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "cargo", "env"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
colored = "3.1.1"
env_logger = "0.11.11"
indicatif = "0.18.6"
inquire = { version = "0.9.4", features = ["date"] }
itertools = "0.15.0"
log = "0.4.34"
miette = { version = "7.6.0", features = ["fancy"] }
open = "5.4.4"
petgraph = "0.8.3"
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
spares_core = { path = "../spares_core" }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "chrono", "json", "migrate", "regexp"] }
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
terminal_size = "0.4.4"
tokio = { version = "1.53.1", features = ["full"] }
walkdir = "2.5.0"

[lints]
workspace = true
